# Single source of truth for my public activity (talks, mentoring, community).
#
# Edit THIS file, never the generated block in README.md: a GitHub Action
# re-renders the README on every push that touches brag.yml. The blog page
# (blog.fhgomes.com) is generated from this same file.
#
# Entry fields:
#   date     YYYY-MM-DD (required)
#   event    event name (required)
#   title    session title, in English (required)
#   url      main link: recording, slides or event page (optional)
#   extra    list of {label, url} for secondary links (optional)
#   format   talk | panel | podcast | live | mentoring (optional)
#   note     one line shown under the entry (optional)
#   with     co-hosts / guests (optional)
#
# Newest first is not required: the renderer sorts by date.

